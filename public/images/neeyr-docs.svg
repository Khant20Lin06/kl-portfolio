<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c0e11"/>
  
  <!-- Swagger Header -->
  <rect x="25" y="20" width="750" height="45" rx="8" fill="#14181c" stroke="rgba(255,255,255,0.08)"/>
  <rect x="42" y="32" width="22" height="22" rx="4" fill="#85ea2d"/>
  <text x="53" y="47" text-anchor="middle" fill="#000" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900">{ }</text>
  <text x="75" y="48" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">NeeYrAPI Docs · drf-spectacular</text>
  <rect x="635" y="30" width="125" height="25" rx="4" fill="#1e252d"/>
  <text x="697" y="47" text-anchor="middle" fill="#85ea2d" font-family="'JetBrains Mono', monospace" font-size="10">OAS 3.0.3 CONTRACT</text>

  <!-- Endpoint list -->
  <g transform="translate(25, 80)">
    <!-- Endpoint 1 -->
    <rect x="0" y="0" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="10" width="55" height="25" rx="4" fill="#2563eb"/>
    <text x="39" y="27" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST</text>
    <text x="80" y="28" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/auth/jwt/create/</text>
    <text x="480" y="27" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Issue access &amp; refresh tokens</text>

    <!-- Endpoint 2 -->
    <rect x="0" y="55" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="65" width="55" height="25" rx="4" fill="#16a34a"/>
    <text x="39" y="82" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="80" y="83" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/directory/listings/</text>
    <text x="480" y="82" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Search businesses with radius filter</text>

    <!-- Endpoint 3 -->
    <rect x="0" y="110" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="120" width="55" height="25" rx="4" fill="#d97706"/>
    <text x="39" y="137" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PUT</text>
    <text x="80" y="138" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/directory/listings/{id}/</text>
    <text x="480" y="137" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Owner / Admin update listing details</text>

    <!-- Endpoint 4 -->
    <rect x="0" y="165" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="175" width="55" height="25" rx="4" fill="#2563eb"/>
    <text x="39" y="192" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST</text>
    <text x="80" y="193" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/ads/campaigns/boost/</text>
    <text x="480" y="192" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Initiate auction bid for sponsored listing</text>

    <!-- Endpoint 5 -->
    <rect x="0" y="220" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="230" width="55" height="25" rx="4" fill="#16a34a"/>
    <text x="39" y="247" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="80" y="248" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/analytics/impressions/</text>
    <text x="480" y="247" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Aggregated impressions by advertiser</text>

    <!-- Endpoint 6 -->
    <rect x="0" y="275" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="285" width="55" height="25" rx="4" fill="#dc2626"/>
    <text x="39" y="302" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DEL</text>
    <text x="80" y="303" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/reviews/{id}/</text>
    <text x="480" y="302" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Delete flagged review (RBAC: Moderator)</text>

    <!-- Endpoint 7 -->
    <rect x="0" y="330" width="750" height="45" rx="6" fill="#141920" stroke="#1f2732"/>
    <rect x="12" y="340" width="55" height="25" rx="4" fill="#16a34a"/>
    <text x="39" y="357" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="80" y="358" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">/api/v1/schema/swagger-ui/</text>
    <text x="480" y="357" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">Interactive Swagger UI Contract Spec</text>
  </g>
</svg>
