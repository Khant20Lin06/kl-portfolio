<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0c0e11"/>
  
  <!-- Left phone: Rider App -->
  <g transform="translate(100, 30)">
    <rect x="0" y="0" width="260" height="440" rx="28" fill="#11151a" stroke="#252e38" stroke-width="2"/>
    <!-- Speaker & Camera notch -->
    <rect x="90" y="10" width="80" height="14" rx="7" fill="#181e26"/>
    <!-- Status bar -->
    <text x="25" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">9:41</text>
    <text x="210" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">5G 98%</text>
    
    <!-- Rider Header -->
    <text x="25" y="65" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Rider Dispatch Portal</text>
    <rect x="25" y="75" width="210" height="70" rx="8" fill="#161c22" stroke="#22c55e" stroke-width="0.8"/>
    <text x="38" y="98" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">NEW DELIVERY REQUEST</text>
    <text x="38" y="116" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Burger Lab · 1.8 km ($6.50)</text>
    <text x="38" y="132" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Est. Delivery Time: 15 mins</text>

    <!-- Accept Button -->
    <rect x="25" y="155" width="210" height="34" rx="8" fill="#22c55e"/>
    <text x="130" y="176" text-anchor="middle" fill="#000" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ACCEPT DELIVERY</text>

    <!-- Map mini preview -->
    <rect x="25" y="200" width="210" height="150" rx="8" fill="#181f27"/>
    <circle cx="100" cy="270" r="12" fill="#22c55e" fill-opacity="0.3"/>
    <circle cx="100" cy="270" r="5" fill="#22c55e"/>
    <path d="M 100 270 Q 150 240 180 280" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="180" cy="280" r="6" fill="#f43f5e"/>

    <!-- Bottom Nav -->
    <rect x="25" y="365" width="210" height="50" rx="8" fill="#151a21"/>
    <text x="60" y="394" text-anchor="middle" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="9">Orders</text>
    <text x="130" y="394" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Wallet</text>
    <text x="200" y="394" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Profile</text>
  </g>

  <!-- Right phone/tablet: Merchant Portal -->
  <g transform="translate(420, 30)">
    <rect x="0" y="0" width="280" height="440" rx="16" fill="#11151a" stroke="#252e38" stroke-width="2"/>
    <!-- Merchant App Header -->
    <rect x="0" y="0" width="280" height="45" rx="16" fill="#171c23"/>
    <text x="20" y="28" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Merchant Kitchen KDS</text>
    <circle cx="255" cy="23" r="5" fill="#22c55e"/>

    <!-- Active Orders list -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#161c22" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ORDER #9420 · PREPARING</text>
      <text x="12" y="44" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">2x Wagyu Cheese Burger</text>
      <text x="12" y="62" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">1x Truffle Fries (Timer: 04:12)</text>

      <rect x="0" y="90" width="250" height="80" rx="8" fill="#161c22" stroke="rgba(255,255,255,0.08)"/>
      <text x="12" y="114" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ORDER #9421 · READY FOR PICKUP</text>
      <text x="12" y="134" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">1x Smoked Salmon Bowl</text>
      <text x="12" y="152" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Courier arrived outside</text>

      <rect x="0" y="180" width="250" height="80" rx="8" fill="#161c22" stroke="rgba(255,255,255,0.08)"/>
      <text x="12" y="204" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ORDER #9422 · SCHEDULED</text>
      <text x="12" y="224" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">4x Iced Matcha Latte</text>
      <text x="12" y="242" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Pickup at 11:30 AM</text>

      <rect x="0" y="270" width="250" height="85" rx="8" fill="#13171d"/>
      <text x="12" y="295" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Today's Revenue: $1,842.00</text>
      <text x="12" y="318" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Completed Deliveries: 64</text>
      <text x="12" y="336" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Average Preparation: 8.4 mins</text>
    </g>
  </g>
</svg>
