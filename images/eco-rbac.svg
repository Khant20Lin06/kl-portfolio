<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0d0f12"/>
  
  <!-- Header -->
  <rect x="25" y="25" width="750" height="45" rx="8" fill="#13171d" stroke="#1f252d"/>
  <text x="45" y="52" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">RBAC &amp; JWT AUTHENTICATION FLOW · MULTI-ROLE SECURITY MATRIX</text>
  <rect x="660" y="35" width="95" height="24" rx="12" fill="rgba(127,217,154,0.15)"/>
  <text x="707" y="51" text-anchor="middle" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10">NESTJS GUARDS</text>

  <!-- Flow Diagrams (3 Columns: Roles, JWT Payload, Permissions) -->
  <g transform="translate(35, 90)">
    <!-- Column 1: Roles -->
    <rect x="0" y="0" width="220" height="370" rx="10" fill="#12161b" stroke="#222932"/>
    <text x="20" y="30" fill="#7fd99a" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">1. Defined Roles</text>
    
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#181e25" stroke="#f43f5e" stroke-width="0.8"/>
      <text x="12" y="24" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SUPER_ADMIN</text>
      <text x="12" y="44" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10">Platform oversight, escrow release, vendor vetting</text>

      <rect x="0" y="85" width="190" height="70" rx="6" fill="#181e25" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="109" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">VENDOR / SELLER</text>
      <text x="12" y="129" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10">Manage store listings, view sales, dispatch orders</text>

      <rect x="0" y="170" width="190" height="70" rx="6" fill="#181e25" stroke="#22c55e" stroke-width="0.8"/>
      <text x="12" y="194" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CUSTOMER / BUYER</text>
      <text x="12" y="214" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10">Place orders, post reviews, direct chat with vendors</text>
    </g>

    <!-- Column 2: JWT Verification -->
    <rect x="250" y="0" width="230" height="370" rx="10" fill="#12161b" stroke="#222932"/>
    <text x="270" y="30" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">2. JWT Claims Token</text>
    
    <g transform="translate(265, 50)">
      <rect x="0" y="0" width="200" height="295" rx="6" fill="#0f1317" stroke="#1f262f"/>
      <text x="15" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">// Signed Payload</text>
      <text x="15" y="52" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">{</text>
      <text x="25" y="74" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">  "sub":</text>
      <text x="80" y="74" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10">"usr_84920",</text>
      
      <text x="25" y="98" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">  "role":</text>
      <text x="85" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">"VENDOR",</text>

      <text x="25" y="122" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">  "storeId":</text>
      <text x="105" y="122" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10">"str_114",</text>

      <text x="25" y="146" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">  "scopes": [</text>
      <text x="35" y="170" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">    "product:write",</text>
      <text x="35" y="194" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">    "orders:manage",</text>
      <text x="35" y="218" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">    "chat:send"</text>
      <text x="25" y="242" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">  ],</text>
      <text x="25" y="266" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">  "exp": 1789204000</text>
      <text x="15" y="285" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">}</text>
    </g>

    <!-- Column 3: NestJS Guard Enforcement -->
    <rect x="510" y="0" width="220" height="370" rx="10" fill="#12161b" stroke="#222932"/>
    <text x="530" y="30" fill="#a78bfa" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">3. Guard Enforcement</text>
    
    <g transform="translate(525, 50)">
      <rect x="0" y="0" width="190" height="85" rx="6" fill="#181e25" stroke="#22c55e" stroke-width="0.8"/>
      <text x="12" y="22" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">@UseGuards(JwtAuthGuard)</text>
      <text x="12" y="42" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Validates signature, blacklist revocation check in Redis.</text>
      <text x="12" y="70" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">✓ PASSED: Token Valid</text>

      <rect x="0" y="100" width="190" height="95" rx="6" fill="#181e25" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="12" y="122" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">@Roles('VENDOR')</text>
      <text x="12" y="142" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10">Checks context metadata against controller route handler.</text>
      <text x="12" y="175" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">✓ AUTHORIZED</text>
    </g>
  </g>
</svg>
