<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0d0f12"/>
  
  <!-- Chat Sidebar -->
  <rect x="0" y="0" width="260" height="500" fill="#12151a" stroke="#1f242c"/>
  <text x="25" y="40" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Conversations</text>
  <rect x="210" y="25" width="30" height="24" rx="12" fill="rgba(127,217,154,0.15)"/>
  <text x="225" y="41" text-anchor="middle" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10">LIVE</text>

  <!-- Channels -->
  <g transform="translate(15, 65)">
    <rect x="0" y="0" width="230" height="65" rx="8" fill="#181e26" stroke="#7fd99a" stroke-width="0.8"/>
    <circle cx="25" cy="32" r="16" fill="#1e293b"/>
    <text x="25" y="37" text-anchor="middle" fill="#7fd99a" font-weight="bold">EG</text>
    <text x="52" y="28" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">EcoGoods Co. (Seller)</text>
    <text x="52" y="46" fill="#7fd99a" font-family="'Space Grotesk', sans-serif" font-size="10">Yes, the 20x bundle is in stock!</text>

    <rect x="0" y="75" width="230" height="65" rx="8" fill="#14181f"/>
    <circle cx="25" cy="107" r="16" fill="#1e293b"/>
    <text x="25" y="112" text-anchor="middle" fill="#38bdf8" font-weight="bold">NB</text>
    <text x="52" y="103" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">NatureBloom Studio</text>
    <text x="52" y="121" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="10">Tracking info dispatched.</text>

    <rect x="0" y="150" width="230" height="65" rx="8" fill="#14181f"/>
    <circle cx="25" cy="182" r="16" fill="#1e293b"/>
    <text x="25" y="187" text-anchor="middle" fill="#a78bfa" font-weight="bold">AL</text>
    <text x="52" y="178" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">ArtisanLoft Crafts</text>
    <text x="52" y="196" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="10">Custom monogramming done.</text>
  </g>

  <!-- Chat Main Window -->
  <rect x="260" y="0" width="540" height="55" fill="#13171d" stroke="#1f242c"/>
  <text x="285" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">EcoGoods Co. · Bamboo Fiber Cup Inquiry</text>
  <text x="285" y="47" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">● Socket.io Connected (12ms)</text>

  <!-- Chat Messages -->
  <g transform="translate(285, 80)">
    <!-- Buyer Message -->
    <rect x="0" y="0" width="340" height="60" rx="10" fill="#171c23" stroke="#252d37"/>
    <text x="15" y="24" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">Hi! If I order 20 units for an office event,</text>
    <text x="15" y="44" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">can we get custom engraved logos?</text>
    <text x="300" y="52" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">10:14 AM</text>

    <!-- Seller Message (right aligned) -->
    <rect x="130" y="80" width="350" height="95" rx="10" fill="#14261f" stroke="#22543d"/>
    <text x="145" y="104" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="11">Absolutely! We support custom laser engraving.</text>
    <text x="145" y="124" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="11">I have attached our B2B wholesale discount card.</text>
    <rect x="145" y="135" width="200" height="30" rx="6" fill="#1a382b"/>
    <text x="160" y="154" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="10">📄 B2B_Custom_Catalog.pdf</text>
    <text x="440" y="168" fill="#7fd99a" font-family="'JetBrains Mono', monospace" font-size="8">10:15 AM</text>

    <!-- Typing indicator -->
    <rect x="0" y="195" width="130" height="30" rx="15" fill="#171c23"/>
    <circle cx="45" cy="210" r="3.5" fill="#7fd99a"/>
    <circle cx="65" cy="210" r="3.5" fill="#7fd99a"/>
    <circle cx="85" cy="210" r="3.5" fill="#7fd99a"/>
  </g>

  <!-- Chat Input Bar -->
  <rect x="285" y="430" width="490" height="48" rx="10" fill="#15191f" stroke="#252c36"/>
  <text x="310" y="460" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11">Type a message or drop files here...</text>
  <rect x="715" y="438" width="50" height="32" rx="6" fill="#7fd99a"/>
  <text x="740" y="458" text-anchor="middle" fill="#000" font-size="14">➤</text>
</svg>
